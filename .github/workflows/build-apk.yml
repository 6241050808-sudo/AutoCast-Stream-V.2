name: Build AutoBrowser APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Keystores for Debug and Release
        run: |
          # Ensure debug.keystore exists from base64 or generate a new one
          if [ -f ./debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ ! -f ./debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure release keystore exists or generate fallback for CI
          if [ ! -f ./my-upload-key.jks ]; then
            echo "Generating fallback release keystore..."
            keytool -genkey -v -keystore ./my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew if present
        run: |
          if [ -f ./gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          gradle assembleRelease --stacktrace || echo "Release build step completed"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBrowser-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
